name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 🤖 JOB 1: BIÊN DỊCH ANDROID APK (CHẠY TRÊN UBUNTU SIÊU NHANH)
  # ====================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: ☕ Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Cài đặt thư viện
        run: flutter pub get

      - name: 🤖 Biên dịch Android APK (Bản nhẹ 64-bit + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 💾 Lưu file Android APK vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RunTracker-Android-APK
          path: build/app/outputs/flutter-apk/*.apk

  # ====================================================
  # 🍎 JOB 2: BIÊN DỊCH IOS IPA (CHẠY TRÊN MACOS)
  # ====================================================
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 🐦 Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Cài đặt thư viện
        run: flutter pub get

      - name: 🛠️ Biên dịch iOS Runner
        run: flutter build ios --release --no-codesign

      - name: 📦 Đóng gói thành file .ipa (Payload)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q app.ipa Payload
          echo "✅ Đã đóng gói thành công app.ipa"

      - name: 🚀 Tải lên Diawi (Nếu có cấu hình)
        id: diawi_upload
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          if [ -n "$DIAWI_TOKEN" ]; then
            UPLOAD_RES=$(curl -s https://upload.diawi.com/ -F token="$DIAWI_TOKEN" -F file=@app.ipa -F find_by_udid=0 -F wall_of_apps=0)
            JOB_ID=$(echo $UPLOAD_RES | grep -o '"job": *"[^"]*"' | grep -o '[^"]*' | tail -n 1)
            sleep 10
            STATUS_RES=$(curl -s "https://upload.diawi.com/status?token=$DIAWI_TOKEN&job=$JOB_ID")
            DIAWI_LINK=$(echo $STATUS_RES | grep -o '"link": *"[^"]*"' | grep -o '[^"]*' | tail -n 1)
            echo "install_url=https://install.diawi.com/$DIAWI_LINK" >> $GITHUB_OUTPUT
            echo "### 📱 Link Cài Đặt iPhone: [Bấm vào đây để cài đặt](https://install.diawi.com/$DIAWI_LINK)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Lưu file iOS app.ipa vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RunTracker-iOS-IPA
          path: app.ipa
